# Discord approve/reject message for every PR opened from a branch of this repo (PRs opened by the
# contact-fix workflow use GITHUB_TOKEN, which doesn't trigger this, so they are notified there instead).
# Manual resend: Actions tab -> notify -> Run workflow -> PR number.
name: notify
on:
  pull_request:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

jobs:
  notify:
    # forks get no secrets anyway; skip them explicitly so strangers' PRs never reach Discord
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: actions/checkout@v6
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr || github.event.pull_request.number }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "PR must be a number"; exit 1; }
          bash .github/notify-discord.sh "$PR"
