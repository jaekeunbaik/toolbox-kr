<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D-day 계산기 - 날짜 차이, 며칠째 | toolbox-kr</title>
<meta name="description" content="목표일까지 D-day, 두 날짜 사이 일수, 사귄 지 며칠째인지 계산합니다.">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<nav><a href="/">← 전체 도구</a><a href="/contact">문의하기</a></nav>
<h1>D-day 계산기</h1>
<label>시작일 (보통 오늘) <input type="date" id="from"></label>
<label>목표일 <input type="date" id="to"></label>
<dl aria-live="polite">
  <dt>D-day</dt><dd id="dday">-</dd>
  <dt>두 날짜 차이</dt><dd id="diff">-</dd>
  <dt>시작일을 1일로 세면</dt><dd id="nth">-</dd>
</dl>
<p class="help">기념일(사귄 날, 아기 태어난 날)은 보통 시작일을 1일째로 셉니다. 목표일을 과거로 넣으면 지난 날짜(D+)로 표시됩니다.</p>
<script type="module">
  import { daysBetween, parseDate, todayParts } from '/js/calc.js';
  const $ = id => document.getElementById(id);
  const t = todayParts(), iso = p => `${p.y}-${String(p.m).padStart(2, '0')}-${String(p.d).padStart(2, '0')}`;
  $('from').value = iso(t);
  $('to').value = `${t.y}-12-25`;
  const show = () => {
    if (!$('from').value || !$('to').value) return;
    const n = daysBetween(parseDate($('from').value), parseDate($('to').value));
    $('dday').textContent = n === 0 ? 'D-Day' : n > 0 ? `D-${n}` : `D+${-n}`;
    $('diff').textContent = `${Math.abs(n).toLocaleString()}일`;
    $('nth').textContent = `${(Math.abs(n) + 1).toLocaleString()}일째`;
  };
  document.addEventListener('input', show);
  show();
</script>
</body>
</html>
