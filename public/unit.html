<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단위 변환기: 길이·무게·온도, 근·돈·자 | toolbox-kr</title>
<meta name="description" content="센티미터, 인치, 피트, 킬로그램, 파운드, 근, 돈, 자, 섭씨, 화씨를 서로 바꿔 드립니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site"><a class="home" href="/">toolbox-kr</a><a href="/contact">문의하기</a></header>
<main>
<h1>단위 변환기</h1>
<p class="lede">길이, 무게, 온도를 바꿉니다. 근, 돈, 자 같은 전통 단위도 됩니다.</p>
<form id="f">
  <fieldset class="choice">
    <legend>종류</legend>
    <label><input type="radio" name="kind" value="length" checked><span>길이</span></label>
    <label><input type="radio" name="kind" value="weight"><span>무게</span></label>
    <label><input type="radio" name="kind" value="temp"><span>온도</span></label>
  </fieldset>
  <div class="inputs">
    <label>값<input type="number" name="v" value="1" step="any" inputmode="decimal"></label>
    <label>이 단위에서<select name="from"></select></label>
    <label>이 단위로<select name="to"></select></label>
  </div>
</form>
<section class="answer" aria-live="polite">
  <p class="answer-label">결과</p>
  <p class="answer-value"><mark id="res">-</mark></p>
</section>
<section class="notes">
  <h2>전통 단위</h2>
  <ul>
    <li>1자(척)는 10/33m, 약 30.3cm입니다.</li>
    <li>1근은 고기를 잴 때 600g이에요. 채소는 375g으로 쓰기도 합니다.</li>
    <li>1돈은 3.75g입니다. 금 시세에서 쓰는 단위예요.</li>
  </ul>
</section>
<script type="module">
  import { UNITS, convert, cToF, fToC, num } from '/js/calc.js';
  const f = document.getElementById('f');
  const NAMES = { mm: '밀리미터 (mm)', cm: '센티미터 (cm)', m: '미터 (m)', km: '킬로미터 (km)', in: '인치 (in)', ft: '피트 (ft)', yd: '야드 (yd)', mi: '마일 (mi)', '자': '자 (척)',
    mg: '밀리그램 (mg)', g: '그램 (g)', kg: '킬로그램 (kg)', t: '톤 (t)', oz: '온스 (oz)', lb: '파운드 (lb)', '돈': '돈', '근': '근 (600g)', C: '섭씨 (°C)', F: '화씨 (°F)' };
  const SYMBOL = { C: '°C', F: '°F', '자': '자', '돈': '돈', '근': '근' };
  const DEFAULTS = { length: ['자', 'cm'], weight: ['근', 'kg'], temp: ['F', 'C'] };
  let kind;
  const fill = () => {
    kind = f.kind.value;
    const keys = kind === 'temp' ? ['C', 'F'] : Object.keys(UNITS[kind]);
    for (const [sel, def] of [[f.from, DEFAULTS[kind][0]], [f.to, DEFAULTS[kind][1]]])
      sel.innerHTML = keys.map(k => `<option value="${k}"${k === def ? ' selected' : ''}>${NAMES[k]}</option>`).join('');
    if (kind === 'temp') f.v.value = 100;
  };
  const show = () => {
    if (f.kind.value !== kind) fill();
    const v = +f.v.value, from = f.from.value, to = f.to.value;
    if (f.v.value === '' || !Number.isFinite(v)) { document.getElementById('res').textContent = '-'; return; }
    const out = kind === 'temp' ? (from === to ? v : from === 'C' ? cToF(v) : fToC(v)) : convert(kind, v, from, to);
    const sym = u => SYMBOL[u] ?? u;
    document.getElementById('res').textContent = `${num(v, 4)}${sym(from)} = ${num(out, 4)}${sym(to)}`;
  };
  f.addEventListener('input', show);
  fill(); show();
</script>
</main>
<footer><p>계산 결과는 참고용이며 실제 금액은 기관·계약 조건에 따라 다를 수 있어요. 필요한 계산기가 있으면 <a href="/contact">알려주세요</a>.</p></footer>
</body>
</html>
