<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부가세 계산기: 공급가액 ↔ 합계금액 | toolbox-kr</title>
<meta name="description" content="공급가액에서 부가세 10%를 더하거나, 합계금액에서 공급가액과 부가세를 나눠 계산합니다.">
<link rel="canonical" href="https://toolbox-kr.ethan-kr.workers.dev/vat">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="toolbox-kr">
<meta property="og:title" content="부가세 계산기: 공급가액 ↔ 합계금액 | toolbox-kr">
<meta property="og:description" content="공급가액에서 부가세 10%를 더하거나, 합계금액에서 공급가액과 부가세를 나눠 계산합니다.">
<meta property="og:url" content="https://toolbox-kr.ethan-kr.workers.dev/vat">
<meta name="theme-color" content="#EEF1EC">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site"><a class="home" href="/">toolbox-kr</a><a href="/contact">문의하기</a></header>
<main>
<h1>부가세 계산기</h1>
<p class="lede">부가가치세 10%를 더하거나, 합계 금액에서 부가세를 분리합니다.</p>
<form id="f">
  <fieldset class="choice">
    <legend>가지고 있는 금액</legend>
    <label><input type="radio" name="mode" value="total" checked><span>합계 금액 (부가세 포함)</span></label>
    <label><input type="radio" name="mode" value="supply"><span>공급가액 (부가세 별도)</span></label>
  </fieldset>
  <div class="inputs">
    <label>금액 (원)<input type="number" name="amount" value="11000" data-won min="0" step="1" inputmode="numeric" required></label>
  </div>
</form>
<section class="answer" aria-live="polite">
  <p class="answer-label">부가세</p>
  <p class="answer-value"><mark id="vat">-</mark></p>
  <dl class="detail">
    <dt>공급가액</dt><dd id="supply">-</dd>
    <dt>합계 금액</dt><dd id="total">-</dd>
  </dl>
</section>
<section class="notes">
  <h2>알아두면 좋은 점</h2>
  <ul>
    <li>합계에서 나눌 때는 공급가액 = 합계 ÷ 1.1을 원 단위로 반올림했어요. 세금계산서 발행 프로그램에 따라 1원 차이가 날 수 있습니다.</li>
  </ul>
</section>
<script type="module">
  import { vatFromSupply, vatFromTotal, won } from '/js/calc.js';
  const f = document.getElementById('f'), $ = id => document.getElementById(id);
  const show = () => {
    const a = Math.round(+f.amount.value);
    if (!(a >= 0)) return;
    const x = f.mode.value === 'total' ? vatFromTotal(a) : vatFromSupply(a);
    $('vat').textContent = won(x.vat);
    $('supply').textContent = won(x.supply);
    $('total').textContent = won(x.total);
  };
  f.addEventListener('input', show);
  show();
</script>
<script type="module" src="/js/won-hint.js"></script>
<script type="module" src="/js/share.js"></script>
<nav class="related" aria-label="관련 계산기"><h2>함께 쓰는 계산기</h2><ul><li><a href="/discount">할인율</a></li><li><a href="/percent">퍼센트</a></li><li><a href="/wage">시급·주휴수당</a></li></ul></nav>
</main>
<footer><p>계산 결과는 참고용이며 실제 금액은 기관·계약 조건에 따라 다를 수 있어요. 필요한 계산기가 있으면 <a href="/contact">알려주세요</a>.</p></footer>
</body>
</html>
