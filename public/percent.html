<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>퍼센트 계산기: 비율, 증감률 | toolbox-kr</title>
<meta name="description" content="A의 B%, A는 B의 몇 %, 증가율·감소율을 바로 계산합니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site"><a class="home" href="/">toolbox-kr</a><a href="/contact">문의하기</a></header>
<main>
<h1>퍼센트 계산기</h1>
<p class="lede">빈칸에 숫자를 넣으면 문장 속 답이 바로 바뀝니다.</p>
<p class="sentence">
  <input type="number" step="any" id="a1" value="200" aria-label="A" inputmode="decimal">의
  <input type="number" step="any" id="b1" value="15" aria-label="B 퍼센트" inputmode="decimal">%는
  <output id="o1" aria-live="polite"><mark>-</mark></output>
</p>
<p class="sentence">
  <input type="number" step="any" id="a2" value="30" aria-label="A" inputmode="decimal">는
  <input type="number" step="any" id="b2" value="200" aria-label="B" inputmode="decimal">의
  <output id="o2" aria-live="polite"><mark>-</mark></output>
</p>
<p class="sentence">
  <input type="number" step="any" id="a3" value="100" aria-label="이전 값" inputmode="decimal">에서
  <input type="number" step="any" id="b3" value="120" aria-label="이후 값" inputmode="decimal">으로 바뀌면
  <output id="o3" aria-live="polite"><mark>-</mark></output>
</p>
<section class="notes">
  <h2>알아두면 좋은 점</h2>
  <ul>
    <li>증감률은 (나중 값 − 처음 값) ÷ 처음 값 × 100입니다.</li>
    <li>금리가 2%에서 3%로 오르면 1%p(퍼센트포인트) 오른 것이고, 증가율로는 50%입니다.</li>
  </ul>
</section>
<script type="module">
  import { percentOf, ratio, change, num } from '/js/calc.js';
  const v = id => +document.getElementById(id).value;
  const say = (id, x, suffix = '') => document.getElementById(id).firstElementChild.textContent = Number.isFinite(x) ? num(x, 4) + suffix : '-';
  const show = () => {
    say('o1', percentOf(v('a1'), v('b1')));
    say('o2', ratio(v('a2'), v('b2')), '%');
    const c = change(v('a3'), v('b3'));
    say('o3', Math.abs(c), c > 0 ? '% 증가' : c < 0 ? '% 감소' : '% (변화 없음)');
  };
  document.addEventListener('input', show);
  show();
</script>
</main>
<footer><p>계산 결과는 참고용이며 실제 금액은 기관·계약 조건에 따라 다를 수 있어요. 필요한 계산기가 있으면 <a href="/contact">알려주세요</a>.</p></footer>
</body>
</html>
