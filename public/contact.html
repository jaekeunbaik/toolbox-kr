<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의하기 | toolbox-kr</title>
<meta name="description" content="필요한 계산기나 고쳐야 할 점을 알려주세요.">
<link rel="canonical" href="https://toolbox-kr.ethan-kr.workers.dev/contact">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="toolbox-kr">
<meta property="og:title" content="문의하기 | toolbox-kr">
<meta property="og:description" content="필요한 계산기나 고쳐야 할 점을 알려주세요.">
<meta property="og:url" content="https://toolbox-kr.ethan-kr.workers.dev/contact">
<meta name="theme-color" content="#EEF1EC">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site"><a class="home" href="/">toolbox-kr</a><a href="/contact">문의하기</a></header>
<main>
<h1>문의하기</h1>
<p class="lede">필요한 계산기나 틀린 부분을 알려주세요. 따로 답장은 드리지 않지만, 검토한 뒤 사이트에 반영합니다.</p>
<form id="f">
  <label class="field">내용
    <textarea id="m" name="message" required minlength="5" maxlength="2000" placeholder="예: 연봉 실수령액 계산기를 만들어 주세요"></textarea>
  </label>
  <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <p><button class="primary" type="submit">보내기</button></p>
  <p id="s" role="status"></p>
</form>
<script>
  const f = document.getElementById('f'), s = document.getElementById('s'), btn = f.querySelector('button');
  f.addEventListener('submit', async e => {
    e.preventDefault();
    btn.disabled = true;
    s.className = '';
    s.textContent = '보내는 중';
    try {
      const r = await fetch('/api/contact', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(f))),
      });
      const d = await r.json();
      s.textContent = d.ok ? '보냈습니다. 검토 후 반영할게요.' : d.error;
      if (d.ok) f.reset(); else s.className = 'error';
    } catch { s.className = 'error'; s.textContent = '전송하지 못했어요. 인터넷 연결을 확인하고 다시 보내 주세요.'; }
    btn.disabled = false;
  });
</script>
</main>
<footer><p>계산 결과는 참고용이며 실제 금액은 기관·계약 조건에 따라 다를 수 있어요. 필요한 계산기가 있으면 <a href="/contact">알려주세요</a>.</p></footer>
</body>
</html>
